log_format upstream_time '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'upstream_status=$upstream_status upstream_addr=$upstream_addr '
                       'request_time=$request_time upstream_response_time=$upstream_response_time';

server {
    listen       80;
    server_name  _;

    # Serve Angular app
    root /usr/share/nginx/html;
    index index.html;

    # Log to Docker stdout/stderr with upstream details
    access_log /dev/stdout upstream_time;
    error_log  /dev/stderr info;

    # Frontend routes (Angular) fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to FastAPI backend service
    # Normalize trailing slash and proxy
    location = /api { return 301 /api/; }
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
